url: https://inspercidades.github.io/inspercidados/

template:
  bootstrap: 5
  light-switch: true
  theme: github-light
  theme-dark: github-dark
  bslib:
    # Insper Cidades colours from insperplot, split by job: asfalto carries
    # everything clickable, folhagem stays on structural rules (see extra.scss).
    # Asfalto works at its published value (9.0:1 on white); folhagem does not
    # (3.6:1), which is why the old link colour was two steps off brand.
    primary: "#7F1582"
    secondary: "#626D76"
    success: "#056958"
    info: "#04806C"
    warning: "#D58B02"
    danger: "#B23100"
    body-color: "#1B252D"
    body-bg-dark: "#121B22"
    body-color-dark: "#DDE3E8"
    link-color-dark: "#D183D3"
    # bslib bundles only weight 400 unless weights are listed
    base_font: {google: {family: "Inter", wght: [400, 500, 600, 700]}}
    heading_font: {google: {family: "Inter", wght: [400, 500, 600, 700]}}
    code_font: {google: {family: "JetBrains Mono", wght: [400, 500]}}
    headings-font-weight: 600
    border-radius: 0.375rem
    pkgdown-nav-height: 72px

navbar:
  # Navbar colour lives in pkgdown/extra.scss: pkgdown ignores `navbar: bg:`
  # whenever `light-switch` is enabled.
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/inspercidades/inspercidados
      aria-label: GitHub

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]

footer:
  structure:
    left: developed_by
    right: built_with

authors:
  Vinicius Oike:
    href: https://github.com/viniciusoike

reference:
  - title: Discover data
    contents:
      - list_datasets
      - list_resources
      - list_projects
  - title: Download data
    contents:
      - get_dataset
      - get_dataverse
  - title: Cite and reproduce
    contents:
      - cite_dataset
      - open_project
      - get_script
  - title: Internal
    contents:
      - live_examples
